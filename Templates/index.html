<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UPI Smart Parking - Layout 4 Blok</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .floor-switch { display: flex; gap: 10px; margin-bottom: 10px; }
      .btn-floor { padding: 8px 16px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; border-radius: 6px; font-weight: 600; color: #64748b; transition: 0.2s; }
      .btn-floor:hover { background: #f1f5f9; }
      .btn-floor.active { background: #2563eb; color: white; border-color: #2563eb; }
      .slot-group text { text-anchor: middle; font-family: sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </head>

      <h1>UPI Smart Parking</h1>
      <div class="badge">System Online</div>

        </div>

              <text x="50" y="400" font-size="12" text-anchor="middle" font-weight="bold">⬅ KELUAR</text>

            <path id="routePath" class="route" d="" />
            <circle id="carMarker" r="6" fill="var(--blue)" stroke="#fff" stroke-width="2" style="display: none" />
          </svg>
        </div>
      </main>

      <aside class="card controls">
        <button class="primary" id="btnSearch">CARI PARKIR KOSONG</button>
        <div class="result-box">
          <div class="result-meta">Rekomendasi</div>
          <div class="result-slot" id="resCode">--</div>
          <div class="result-meta" id="resDist">...</div>
          <div class="result-meta" id="resETA"></div>
        </div>
        <div class="chat" id="aiChat">System Ready.</div>
        <div style="display: flex; gap: 10px">
          <button id="btnClear">Reset</button>
